spring.application.name=audit-management

# ── Database ─────────────────────────────────────────────────────────
# Set these as environment variables before running:
#   AUDIT_DB_URL      (default: H2 in-memory for demo)
#   AUDIT_DB_USER     (default: sa)
#   AUDIT_DB_PASSWORD (default: empty)
spring.datasource.url=${AUDIT_DB_URL:jdbc:h2:mem:auditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AUDIT_DB_USER:sa}
spring.datasource.password=${AUDIT_DB_PASSWORD:}
spring.datasource.driver-class-name=${AUDIT_DB_DRIVER:org.h2.Driver}

# ── H2 Console (only active when using H2) ───────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ──────────────────────────────────────────────────────────────
spring.jpa.database-platform=${AUDIT_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── JWT ──────────────────────────────────────────────────────────────
# Set this as environment variable:
#   AUDIT_JWT_SECRET  (must be at least 32 characters)
#   AUDIT_JWT_EXPIRY  (milliseconds, default 24 hours)
app.jwt.secret=${AUDIT_JWT_SECRET:AuditProDefaultSecretKeyForDevelopmentOnlyChangeInProduction2024}
app.jwt.expiration=${AUDIT_JWT_EXPIRY:86400000}

# ── Disable auto SQL script execution ────────────────────────────────
spring.sql.init.mode=never

# ── Server ───────────────────────────────────────────────────────────
server.port=${PORT:8080}
